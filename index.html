<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SüffIQ – das Trinkspiel</title>
<style>
  :root{
    --bg:#1B0F2B; --bg2:#26153B; --ink:#FFF3DC; --mute:#A392BD;
    --gold:#F5B82E; --pink:#FF4F8B; --line:rgba(255,243,220,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.4;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{min-height:100%;max-width:520px;margin:0 auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:18px}
  h1{font-size:clamp(34px,10vw,56px);line-height:.95;letter-spacing:-.03em;font-weight:900}
  h2{font-size:clamp(26px,7.5vw,38px);line-height:1.05;letter-spacing:-.02em;font-weight:800}
  p{color:var(--mute)}
  .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
  .top b{font-size:14px;color:var(--gold);letter-spacing:.08em}
  .top span{font-size:14px;color:var(--mute)}
  input{
    width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;
    background:var(--bg2);color:var(--ink);border:2px solid var(--line);outline:none
  }
  input:focus{border-color:var(--gold)}
  input.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800;font-size:28px}
  button{
    font:inherit;font-weight:800;font-size:18px;padding:16px 18px;border-radius:16px;border:0;cursor:pointer;
    background:var(--gold);color:#2A1A05;width:100%;transition:transform .08s
  }
  button:active{transform:scale(.97)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  button.alt{background:var(--bg2);color:var(--ink);border:2px solid var(--line)}
  button.pink{background:var(--pink);color:#fff}
  button.small{font-size:14px;padding:9px 12px;width:auto;border-radius:10px}
  button[disabled]{opacity:.45;cursor:default}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .stack{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--bg2);border-radius:18px;padding:16px}
  .code-big{font-size:clamp(56px,20vw,96px);font-weight:900;letter-spacing:.12em;line-height:1;color:var(--gold);text-align:center;padding:16px 0 6px}
  .players{display:flex;flex-direction:column;gap:6px}
  .pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg2)}
  .pl .n{flex:1;font-weight:700;font-size:17px}
  .pl .d{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
  .pl .d::after{content:" 🍺";font-size:14px}
  .pl.off{opacity:.45}
  .pl.host .n::after{content:" · Roundmaster";color:var(--pink);font-weight:600;font-size:13px}
  .pl.me{outline:2px solid var(--line)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
  .dot.on{background:#54E07E}
  .cats{display:flex;flex-wrap:wrap;gap:8px}
  .cat{padding:9px 14px;border-radius:999px;border:2px solid var(--line);color:var(--mute);font-weight:700;font-size:15px;background:transparent;width:auto}
  .cat.on{border-color:var(--gold);color:var(--gold)}
  .q{text-align:center;padding:22px 0 8px}
  .q .lab{color:var(--pink);font-weight:700;font-size:15px;margin-bottom:12px}
  .q h2{font-size:clamp(28px,8vw,40px)}
  .wait{color:var(--mute);text-align:center;font-size:15px}
  .vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vote button{padding:22px 10px;font-size:20px}
  .big{font-size:clamp(48px,16vw,80px);font-weight:900;line-height:1;text-align:center;color:var(--gold)}
  .drinkers{display:flex;flex-direction:column;gap:8px}
  .dr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--pink);color:#fff;font-weight:800;font-size:19px}
  .dr.you{box-shadow:0 0 0 3px var(--ink) inset}
  .bar{display:flex;align-items:center;gap:10px;font-size:15px}
  .bar .t{width:34%;color:var(--mute);text-align:right}
  .bar .b{height:12px;background:var(--gold);border-radius:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .hostbar{border-top:1px solid var(--line);padding-top:14px}
  .timer{height:14px;border-radius:7px;background:var(--bg2);overflow:hidden;margin-top:6px}
  .timer .fill{height:100%;width:100%;border-radius:7px;background:hsl(120 80% 55%);transition:width .1s linear,background-color .3s linear}
  .timer.done .fill{background:hsl(0 80% 55%)}
  .timer-lab{font-size:13px;color:var(--mute);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
  .opts{display:flex;gap:6px;flex-wrap:wrap}
  .opts button{width:auto;font-size:14px;padding:8px 12px;border-radius:10px;background:transparent;border:2px solid var(--line);color:var(--mute)}
  .opts button.on{border-color:var(--pink);color:var(--pink)}
  .brand{font-weight:900;letter-spacing:-.02em}
  .player{display:flex;align-items:center;gap:14px;background:var(--bg2);border-radius:16px;padding:14px}
  .player .art{width:64px;height:64px;border-radius:12px;background:var(--bg);object-fit:cover;filter:blur(6px)}
  .player button{flex:1;padding:14px}
  .player .prog{height:6px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden}
  .player .prog i{display:block;height:100%;width:0;background:var(--pink)}
  .pic{position:relative;border-radius:18px;overflow:hidden;background:var(--bg2);aspect-ratio:4/5;max-height:46vh}
  .pic img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:filter 1.2s ease}
  .pic .stage{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
  .credit{font-size:12px;color:var(--mute);text-align:center}
  .hints{display:flex;flex-direction:column;gap:8px}
  .hint{padding:12px 14px;border-radius:12px;background:var(--bg2);font-size:17px;line-height:1.35;border-left:4px solid var(--gold)}
  .hint.new{animation:pop .35s ease-out}
  .hint.pending{opacity:.35;border-left-color:var(--line);color:var(--mute);font-size:14px}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .chat{background:var(--bg2);border-radius:14px;padding:10px;max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .msg{display:flex;gap:8px;align-items:baseline;font-size:15px}
  .msg .who{color:var(--gold);font-weight:700;white-space:nowrap}
  .msg .txt{background:var(--bg);padding:6px 10px;border-radius:10px;border-top-left-radius:2px}
  .msg.sys{justify-content:center;color:#54E07E;font-weight:800;font-size:15px}
  .msg.mine .who{color:var(--pink)}
  .chat:empty::before{content:"Noch keine Tipps. Wer traut sich?";color:var(--mute);font-size:14px;text-align:center}
  @media (prefers-reduced-motion:reduce){.hint.new{animation:none}}
  .brand i{font-style:normal;color:var(--gold)}
  .center{text-align:center}
  .end .pl{padding:14px 16px}
  .end .rank{width:28px;font-weight:900;color:var(--mute)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const $ = document.getElementById("app");
const toastEl = document.getElementById("toast");
let ws, S = null, myName = sessionStorage.getItem("name") || "", pending = false, guessVal = "";
const urlCode = (new URLSearchParams(location.search).get("code") || "").toUpperCase().slice(0,4);
if (urlCode) history.replaceState(null, "", location.pathname);

function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),2500); }
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function connect(){
  const proto = location.protocol==="https:"?"wss":"ws";
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = ()=>{
    const code=sessionStorage.getItem("code"), id=sessionStorage.getItem("id");
    if(code && id) send({t:"rejoin",code,id});
  };
  ws.onmessage = (e)=>{
    const m = JSON.parse(e.data);
    if(m.t==="joined"){ sessionStorage.setItem("code",m.code); sessionStorage.setItem("id",m.id); }
    if(m.t==="state"){ S=m.s; if(S.now) clockOffset=S.now-Date.now(); pending=false; render(); }
    if(m.t==="error"){ toast(m.m); pending=false; }
    if(m.t==="near"){ const n=document.getElementById("near"); if(n){ n.innerHTML='<span style="color:var(--gold);font-weight:800">🔥 Nah dran!</span>'; setTimeout(()=>{ if(n.isConnected) n.innerHTML=""; },4000);} if(navigator.vibrate) navigator.vibrate(60); }
    if(m.t==="reset"){ sessionStorage.removeItem("code"); sessionStorage.removeItem("id"); S=null; renderStart(); }
  };
  ws.onclose = ()=>{ clearInterval(ws.ping); setTimeout(connect,1200); };
  ws.ping = setInterval(()=>send({t:"ping"}), 25000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && ws.readyState!==1) connect(); }, {once:true});
}

// ---------- Screens ----------
function renderStart(){
  $.innerHTML = `
    <div style="padding-top:8vh"></div>
    <h1>${urlCode?"Du bist<br>eingeladen.":`<span class="brand">Süff<i>IQ</i></span><br>Das Trinkspiel<br>für alle Handys.`}</h1>
    <p>${urlCode?`Runde <b style="color:var(--gold)">${esc(urlCode)}</b> wartet. Name eingeben, rein da.`:"Einer erstellt die Runde, die anderen bekommen einen Link. Kein Account, keine Werbung. Wer daneben liegt, trinkt."}</p>
    <div class="stack">
      <input id="name" maxlength="16" placeholder="Dein Name" value="${esc(myName)}" autofocus>
      ${urlCode?`<button id="join">Runde ${esc(urlCode)} beitreten</button><input id="code" type="hidden" value="${esc(urlCode)}"><button id="create" class="alt small">Lieber eigene Runde erstellen</button>`
      :`<button id="create">Neue Runde erstellen</button>
      <div class="row">
        <input id="code" class="code" maxlength="4" placeholder="CODE" style="flex:0 0 46%">
        <button id="join" class="alt">Beitreten</button>
      </div>`}
    </div>
    <p style="font-size:13px">Bitte trinkt verantwortungsvoll. Wasser ist auch ein Getränk.</p>`;
  const name = ()=>{ const v=document.getElementById("name").value.trim(); if(!v){toast("Name fehlt.");return null;} sessionStorage.setItem("name",v); myName=v; return v; };
  document.getElementById("create").onclick=()=>{ const n=name(); if(n) send({t:"create",name:n}); };
  document.getElementById("join").onclick=()=>{ const n=name(); const c=document.getElementById("code").value; if(n&&c.length===4) send({t:"join",name:n,code:c}); else if(n) toast("Code hat 4 Zeichen."); };
  document.getElementById("code").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("join").click(); });
  document.getElementById("name").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById(urlCode?"join":"create").click(); });
}

function me(){ return S.players.find(p=>p.id===S.you); }
function isHost(){ return S.hostId===S.you; }

function playerList(opts={}){
  return `<div class="players">${S.players.map(p=>`
    <div class="pl ${p.connected?"":"off"} ${p.id===S.hostId?"host":""} ${p.id===S.you?"me":""}">
      <span class="dot ${p.connected?"on":""}"></span>
      <span class="n">${esc(p.name)}${opts.answered && p.answered?" ✓":""}</span>
      <span class="d">${p.drinks}</span>
      ${opts.manage && isHost() && p.id!==S.you ? `<button class="small alt" data-host="${p.id}">Roundmaster</button><button class="small alt" data-kick="${p.id}">✕</button>`:""}
    </div>`).join("")}</div>`;
}
function bindManage(){
  $.querySelectorAll("[data-host]").forEach(b=>b.onclick=()=>send({t:"host",id:b.dataset.host}));
  $.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{ if(confirm("Spieler rauswerfen?")) send({t:"kick",id:b.dataset.kick}); });
}

function header(){
  return `<div class="top"><b><span class="brand" style="color:var(--ink)">Süff<i>IQ</i></span> · ${S.code}</b><span>${S.round?`Runde ${S.round}`:"Lobby"} · ${esc(me().name)} · ${me().drinks} 🍺</span></div>`;
}

function renderLobby(){
  $.innerHTML = `
    ${header()}
    <div>
      <p class="center">Freunde geben diesen Code ein:</p>
      <div class="code-big">${S.code}</div>
      <div class="row"><button id="share">Einladungslink teilen</button><button id="copy" class="alt" style="flex:0 0 38%">Kopieren</button></div>
      <p class="center" style="font-size:13px;margin-top:8px">${location.host}</p>
    </div>
    ${playerList({manage:true})}
    ${isHost()?`
      <div class="stack hostbar">
        <p>Kategorien (Roundmaster wählt):</p>
        <div class="cats">${Object.entries(S.cats).map(([k,v])=>`<button class="cat ${S.categories.includes(k)?"on":""}" data-cat="${k}">${v}</button>`).join("")}</div>
        <p>Antwortzeit:</p>
        <div class="opts">${[0,15,30,45,60].map(v=>`<button class="${S.timerSec===v?"on":""}" data-timer="${v}">${v===0?"Kein Limit":v+" s"}</button>`).join("")}</div>
        <button id="start">${S.players.filter(p=>p.connected).length<2?"Solo starten (zum Testen)":"Spiel starten"}</button>
      </div>`
    :`<p class="wait">Warten, bis der Roundmaster startet…</p>`}`;
  bindManage();
  const link = `${location.origin}${location.pathname}?code=${S.code}`;
  const copy = async()=>{ try{ await navigator.clipboard.writeText(link); toast("Link kopiert."); }catch{ prompt("Link kopieren:", link); } };
  document.getElementById("copy").onclick=copy;
  document.getElementById("share").onclick=async()=>{
    if(navigator.share){ try{ await navigator.share({title:"SüffIQ – Trinkspiel", text:`Komm in meine Runde ${S.code}:`, url:link}); }catch{} }
    else copy();
  };
  $.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    let c=S.categories.slice(); const k=b.dataset.cat;
    c = c.includes(k)? c.filter(x=>x!==k) : [...c,k];
    if(!c.length){toast("Mindestens eine Kategorie.");return;}
    send({t:"categories",cats:c});
  });
  $.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>send({t:"timer",sec:Number(b.dataset.timer)}));
  const st=document.getElementById("start"); if(st) st.onclick=()=>send({t:"start"});
}

function renderQuestion(){
  const c=S.current, m=me(), answered=m.answered;
  let body="";
  const nameOf=id=>(S.players.find(p=>p.id===id)||{}).name||"?";

  if(c.type==="wop"){
    const isTarget=c.target===S.you;
    if(c.stage==="choose"){
      body = `<div class="q"><div class="lab">${esc(c.label)}</div><h2>${isTarget?"Du bist dran.":esc(nameOf(c.target))+" ist dran."}</h2></div>`
        + (isTarget?`<div class="vote"><button data-a="wahrheit">Wahrheit</button><button class="pink" data-a="pflicht">Pflicht</button></div>`:`<p class="wait">Wartet auf die Entscheidung…</p>`);
    } else {
      body = `<div class="q"><div class="lab">${esc(nameOf(c.target))} · ${c.choice==="wahrheit"?"Wahrheit":"Pflicht"}</div><h2>${esc(c.task)}</h2></div>`
        + (isHost()?`<div class="row"><button id="done">Erledigt</button><button id="ref" class="pink">Gekniffen (3 🍺)</button></div>`:`<p class="wait">Der Roundmaster entscheidet, ob es zählt.</p>`);
    }
  } else if(c.type==="nie"){
    body = `<div class="q"><div class="lab">${esc(c.label)}</div><h2>${esc(c.text)}</h2></div>`
      + (answered?wait():`<div class="vote"><button class="pink" data-a="ja">Hab ich</button><button data-a="nein">Hab ich nie</button></div>`);
  } else if(c.type==="wer"){
    body = `<div class="q"><div class="lab">${esc(c.label)}</div><h2>${esc(c.text)}</h2></div>`
      + (answered?wait():`<div class="vote">${S.players.filter(p=>p.connected).map(p=>`<button class="alt" data-a="${p.id}">${esc(p.name)}</button>`).join("")}</div>`);
  } else if(c.type==="oder"){
    body = `<div class="q"><div class="lab">${esc(c.label)}</div><h2>Was nimmst du?</h2></div>`
      + (answered?wait():`<div class="vote"><button data-a="0">${esc(c.options[0])}</button><button class="pink" data-a="1">${esc(c.options[1])}</button></div>`);
  } else if(c.type==="werbinich"){
    const solved=(c.solvedBy||[]).includes(S.you);
    const hints=c.hints.map((h,i)=>`<div class="hint ${i===c.hints.length-1?"new":""}">${esc(h)}</div>`).join("")
      + Array.from({length:c.hintCount-c.hints.length},(_,i)=>`<div class="hint pending">Tipp ${c.hints.length+i+1} kommt gleich…</div>`).join("");
    body = `<div class="q" style="padding-top:10px"><div class="lab">${esc(c.label)}</div></div>
      <div class="hints" id="hints">${hints}</div>
      ${solved?`<p class="wait" style="color:#54E07E;font-weight:800">Du hast's! Die anderen raten noch.</p>`
      :`<div class="row"><input id="g" type="text" autocomplete="off" placeholder="Wer bin ich?" value="${esc(guessVal)}"><button id="gs" style="flex:0 0 32%">Raten</button></div><div id="near" class="wait" style="min-height:18px"></div>`}
      <div class="chat" id="chat">${c.chat.map(m=>m.sys?`<div class="msg sys">${esc(m.text)}</div>`:`<div class="msg ${m.name===me().name?"mine":""}"><span class="who">${esc(m.name)}</span><span class="txt">${esc(m.text)}</span></div>`).join("")}</div>`;
  } else if(c.type==="bild"){
    const solved=(c.solvedBy||[]).includes(S.you);
    body = `<div class="q" style="padding-top:10px"><div class="lab">${esc(c.label)}</div></div>
      <div class="pic"><img id="pic" src="${esc(c.image)}" alt="" style="filter:blur(${blurPx(c)}px)"><span class="stage" id="stage">Stufe ${c.revealed}/${c.stages}</span></div>
      ${solved?`<p class="wait" style="color:#54E07E;font-weight:800">Du hast's! Die anderen raten noch.</p>`
      :`<div class="row"><input id="g" type="text" autocomplete="off" placeholder="Wer bin ich?" value="${esc(guessVal)}"><button id="gs" style="flex:0 0 32%">Raten</button></div><div id="near" class="wait" style="min-height:18px"></div>`}
      <div class="chat" id="chat">${chatHtml(c.chat)}</div>`;
  } else if(c.type==="song"){
    const solved=(c.solvedBy||[]).includes(S.you);
    body = `<div class="q" style="padding-top:10px"><div class="lab">${esc(c.label)}</div><h2 style="font-size:24px">Welcher Song ist das?</h2></div>
      <div class="player"><img class="art" src="${esc(c.art||"")}" alt=""><div style="flex:1"><button id="play" class="pink">▶ Abspielen</button><div class="prog"><i id="prog"></i></div></div></div>
      ${solved?`<p class="wait" style="color:#54E07E;font-weight:800">Du hast's! Die anderen raten noch.</p>`
      :`<div class="row"><input id="g" type="text" autocomplete="off" placeholder="Songtitel eingeben" value="${esc(guessVal)}"><button id="gs" style="flex:0 0 32%">Raten</button></div><div id="near" class="wait" style="min-height:18px"></div>`}
      <div class="chat" id="chat">${chatHtml(c.chat)}</div>`;
  } else if(c.type==="trivia"){
    body = `<div class="q"><div class="lab">${esc(c.label)}</div><h2>${esc(c.text)}</h2></div>`
      + (answered?wait():`<div class="vote">${c.options.map((o,i)=>`<button class="alt" data-a="${i}">${esc(o)}</button>`).join("")}</div>`);
  } else if(c.type==="schaetz"){
    body = `<div class="q"><div class="lab">${esc(c.label)}</div><h2>${esc(c.text)}</h2></div>`
      + (answered?wait():`<div class="row"><input id="g" type="number" inputmode="decimal" step="any" placeholder="Deine Schätzung${c.unit?" in "+c.unit:""}" value="${esc(guessVal)}"><button id="gs" style="flex:0 0 38%">Abgeben</button></div>`);
  }

  const timerHtml = c.deadline ? `<div class="timer" id="timer"><div class="fill" id="tfill"></div></div><div class="timer-lab" id="tlab"></div>` : "";
  if(c.type==="werbinich") S.players.forEach(p=>p.answered=(c.solvedBy||[]).includes(p.id));
  $.innerHTML = `${header()}${timerHtml}${body}${playerList({answered:true})}
    ${isHost()?`<div class="row hostbar">${c.type!=="wop"?`<button class="alt small" id="force">Auswerten</button>`:""}<button class="alt small" id="skip">Frage überspringen</button></div>`:""}`;

  $.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ if(pending)return; pending=true; const v=b.dataset.a; send({t:"answer",v:/^\d$/.test(v)?Number(v):v}); });
  const g=document.getElementById("g"), gs=document.getElementById("gs");
  if(gs && (c.type==="werbinich"||c.type==="song"||c.type==="bild")){
    g.oninput=()=>guessVal=g.value; if(document.activeElement!==g && !("ontouchstart" in window)) g.focus();
    const go=()=>{ const v=g.value.trim(); if(v.length<2){toast("Bisschen mehr, bitte.");return;} send({t:"guess",v}); guessVal=""; g.value=""; };
    gs.onclick=go; g.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    const ch=document.getElementById("chat"); if(ch) ch.scrollTop=ch.scrollHeight;
  } else if(gs){ g.oninput=()=>guessVal=g.value; g.focus();
    const go=()=>{ if(g.value===""){toast("Zahl eingeben.");return;} send({t:"answer",v:Number(g.value)}); guessVal=""; };
    gs.onclick=go; g.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }); }
  const d=document.getElementById("done"); if(d) d.onclick=()=>send({t:"wopDone",refused:false});
  const r=document.getElementById("ref"); if(r) r.onclick=()=>send({t:"wopDone",refused:true});
  bindPlayer();
  const f=document.getElementById("force"); if(f) f.onclick=()=>send({t:"force"});
  const s=document.getElementById("skip"); if(s) s.onclick=()=>send({t:"skip"});

  function wait(){ const n=S.players.filter(p=>p.connected&&!p.answered).length; return `<p class="wait">Abgegeben. Noch ${n} ${n===1?"Antwort":"Antworten"} offen…</p>`; }
}

let audio=null, audioKey=null;
function stopAudio(){ if(audio){ audio.pause(); audio=null; } }
function bindPlayer(){
  const btn=document.getElementById("play"), prog=document.getElementById("prog"); if(!btn) return;
  const key=S.code+":"+S.round;
  if(audioKey!==key){ stopAudio(); audioKey=key; }
  const upd=()=>{ if(audio&&prog&&audio.duration) prog.style.width=(audio.currentTime/audio.duration*100)+"%"; };
  const setLabel=()=>{ btn.textContent = audio&&!audio.paused ? "❚❚ Pause" : (audio&&audio.currentTime>0?"▶ Weiter":"▶ Abspielen"); };
  if(audio){ audio.ontimeupdate=upd; audio.onended=setLabel; setLabel(); upd(); }
  btn.onclick=()=>{
    if(!audio){ audio=new Audio(S.current.preview); audio.preload="auto"; audio.ontimeupdate=upd; audio.onended=setLabel; audio.onerror=()=>toast("Vorschau konnte nicht geladen werden."); }
    if(audio.paused) audio.play().catch(()=>toast("Bitte nochmal tippen.")); else audio.pause();
    setTimeout(setLabel,50);
  };
}
let timerRaf=null, clockOffset=0;
function startTimer(){
  const c=S.current; const fill=document.getElementById("tfill"), lab=document.getElementById("tlab"), box=document.getElementById("timer");
  if(!c||!c.deadline||!fill){ if(timerRaf) cancelAnimationFrame(timerRaf); timerRaf=null; return; }
  const total=c.total*1000;
  const tick=()=>{
    const rem=Math.max(0, c.deadline-(Date.now()+clockOffset));
    const f=rem/total;
    fill.style.width=(f*100)+"%";
    fill.style.backgroundColor=`hsl(${Math.round(120*f)} 80% 55%)`;
    lab.textContent=rem>0?Math.ceil(rem/1000)+" s":"Zeit um";
    if(rem<=0){ box.classList.add("done"); timerRaf=null; return; }
    timerRaf=requestAnimationFrame(tick);
  };
  if(timerRaf) cancelAnimationFrame(timerRaf);
  tick();
}

function renderResults(){
  const r=S.result; let extra="";
  if(r.type==="schaetz"){
    extra = `<div class="card stack"><div class="center"><p>Richtige Antwort</p><div class="big">${r.answer}${r.unit?` <span style="font-size:.4em;color:var(--mute)">${esc(r.unit)}</span>`:""}</div></div>
      ${r.guesses.map(g=>`<div class="bar"><span class="t">${esc(g.name)}</span><span>${g.guess}</span></div>`).join("")}</div>`;
  }
  if(r.type==="werbinich"||r.type==="song"||r.type==="bild"){
    extra = `<div class="card stack">${r.image?`<div class="pic" style="max-height:38vh"><img src="${esc(r.image)}" alt="" style="transform:none"></div><p class="credit">Bild: Wikipedia-Artikel „${esc(r.page||r.answer)}“ (Wikimedia Commons)</p>`:""}<div class="center"><p>${r.type==="song"?"Das war":"Ich war"}</p><div class="big" style="font-size:clamp(28px,8vw,42px)">${esc(r.answer)}</div>${r.artist?`<p style="margin-top:4px">${esc(r.artist)}</p>`:""}</div>
      ${r.solvers.length?r.solvers.map(sv=>`<div class="bar"><span class="t">${esc(sv.name)}</span><span>${sv.hint?`bei ${r.type==="bild"?"Stufe":"Tipp"} ${sv.hint}`:"✓ erkannt"}</span></div>`).join(""):""}
      <div class="chat">${r.chat.map(m=>m.sys?`<div class="msg sys">${esc(m.text)}</div>`:`<div class="msg"><span class="who">${esc(m.name)}</span><span class="txt">${esc(m.text)}</span></div>`).join("")}</div></div>`;
  }
  if(r.votes){
    const max=Math.max(1,...r.votes.map(v=>v.n));
    extra = `<div class="card stack">${r.type==="trivia"?`<div class="center"><p>Richtig war</p><div class="big" style="font-size:clamp(26px,8vw,40px)">${esc(r.answer)}</div>${r.artist?`<p style="margin-top:4px">${esc(r.artist)}</p>`:""}</div>`:""}${r.votes.map(v=>`<div class="bar"><span class="t">${esc(v.name)}</span><span class="b" style="width:${Math.round(v.n/max*50)}%"></span><span>${v.n}</span></div>`).join("")}</div>`;
  }
  const meDrinks = r.drinkers.find(d=>d.id===S.you);
  $.innerHTML = `${header()}
    <div class="q"><div class="lab">${esc(S.current.label)}</div><h2 style="font-size:22px;font-weight:600;color:var(--mute)">${esc(r.text)}</h2></div>
    ${extra}
    <div class="stack">
      <h2 class="center">${meDrinks?`Du trinkst ${meDrinks.n}.`:(r.drinkers.length?"Prost, ihr anderen.":"Alle safe.")}</h2>
      <p class="center">${esc(r.lines.join(" "))}</p>
      <div class="drinkers">${r.drinkers.map(d=>`<div class="dr ${d.id===S.you?"you":""}"><span>${esc(d.name)}</span><span>${d.n} 🍺</span></div>`).join("")}</div>
    </div>
    ${playerList()}
    ${isHost()?`<div class="stack hostbar"><button id="next">Nächste Runde</button><button id="end" class="alt small">Spiel beenden</button></div>`:`<p class="wait">Der Roundmaster startet die nächste Runde.</p>`}`;
  const n=document.getElementById("next"); if(n) n.onclick=()=>send({t:"next"});
  const e=document.getElementById("end"); if(e) e.onclick=()=>{ if(confirm("Spiel wirklich beenden?")) send({t:"end"}); };
}

function renderEnd(){
  const sorted=S.players.slice().sort((a,b)=>b.drinks-a.drinks);
  $.innerHTML = `${header()}
    <h1>Feierabend.</h1>
    <p>${S.round} Runden. Hier die Bilanz:</p>
    <div class="players end">${sorted.map((p,i)=>`<div class="pl ${p.id===S.you?"me":""}"><span class="rank">${i+1}.</span><span class="n">${esc(p.name)}</span><span class="d">${p.drinks}</span></div>`).join("")}</div>
    <button id="again" class="alt">Zurück zum Start</button>`;
  document.getElementById("again").onclick=()=>{ sessionStorage.removeItem("code"); sessionStorage.removeItem("id"); S=null; renderStart(); };
}

let wbiKey=null;
function blurPx(c){ const steps=[28,18,11,5,0]; return steps[Math.min(c.revealed,steps.length)-1]; }
function chatHtml(chat){ return chat.map(m=>m.sys?`<div class="msg sys">${esc(m.text)}</div>`:`<div class="msg ${m.name===me().name?"mine":""}"><span class="who">${esc(m.name)}</span><span class="txt">${esc(m.text)}</span></div>`).join(""); }
function patchWbi(){
  const c=S.current, hb=document.getElementById("hints"), ch=document.getElementById("chat");
  if(!ch) return false;
  const shown=hb?hb.querySelectorAll(".hint:not(.pending)").length:0;
  if(hb && shown!==c.hints.length){
    hb.innerHTML = c.hints.map((h,i)=>`<div class="hint ${i===c.hints.length-1?"new":""}">${esc(h)}</div>`).join("")
      + Array.from({length:c.hintCount-c.hints.length},(_,i)=>`<div class="hint pending">Tipp ${c.hints.length+i+1} kommt gleich…</div>`).join("");
  }
  const pic=document.getElementById("pic"), st=document.getElementById("stage");
  if(pic){ pic.style.filter=`blur(${blurPx(c)}px)`; if(st) st.textContent=`Stufe ${c.revealed}/${c.stages}`; }
  const atBottom = ch.scrollHeight-ch.scrollTop-ch.clientHeight<40;
  ch.innerHTML=chatHtml(c.chat); if(atBottom) ch.scrollTop=ch.scrollHeight;
  const solved=(c.solvedBy||[]).includes(S.you), row=document.getElementById("g");
  if(solved && row){ const nr=document.getElementById("near"); if(nr) nr.remove(); row.closest(".row").outerHTML=`<p class="wait" style="color:#54E07E;font-weight:800">Du hast's! Die anderen raten noch.</p>`; }
  S.players.forEach(p=>p.answered=(c.solvedBy||[]).includes(p.id));
  const pl=document.querySelector(".players"); if(pl) pl.outerHTML=playerList({answered:true});
  return true;
}

function render(){
  if(!S) return renderStart();
  if(S.phase!=="question") stopAudio();
  if(S.phase==="lobby") return renderLobby();
  if(S.phase==="question"){
    const key=S.code+":"+S.round;
    const chatty = ["werbinich","song","bild"].includes(S.current.type);
    if(chatty && wbiKey===key && patchWbi()) return;
    wbiKey = chatty ? key : null;
    renderQuestion(); startTimer(); return;
  }
  if(S.phase==="results") return renderResults();
  if(S.phase==="end") return renderEnd();
}
renderStart();
connect();
</script>
</body>
</html>
